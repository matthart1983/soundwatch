name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A second push supersedes the first; there is no value in finishing a run for
# a commit nobody will ever look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only, and it has to be a real one: several tests read the actual
    # CoreAudio HAL — device lists, channel counts, computed latency. They are
    # the tests that would have caught the FFI drift that broke metering.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      # A CI runner has no logged-in user to answer a consent dialog, so the
      # tap will never deliver samples here. What can be checked is that the
      # binary is built the way consent requires: the Info.plist section must
      # be present and the signature must bind it. Getting this wrong is
      # invisible at runtime — the meters just read zero forever.
      - name: Build and sign
        run: make build

      - name: Signature carries the Info.plist
        run: |
          codesign -dvv target/release/soundwatch 2>&1 | tee /tmp/sig
          grep -q 'Identifier=com.soundwatch.lite' /tmp/sig \
            || { echo "::error::signature does not carry the bundle identifier"; exit 1; }
          grep -q 'Info.plist entries=' /tmp/sig \
            || { echo "::error::Info.plist is not bound; TCC cannot prompt"; exit 1; }

      # Releases ship an Intel build too, and the runners are all Apple
      # Silicon. Compiling it here means a broken x86_64 build is a red CI run
      # rather than something discovered while cutting a tag.
      - name: Intel build
        run: cargo build --release --target x86_64-apple-darwin

      - name: Renders without a terminal
        run: |
          for state in main paused filter detail help settings \
                       overview devices streams meters spectrum \
                       latency xruns routing timeline insights; do
            ./target/release/soundwatch --once "$state" --no-color > /dev/null
          done
          ./target/release/soundwatch --demo --once alert --no-color > /dev/null
          # The spectrum fixture has to actually find the faults built into it.
          ./target/release/soundwatch --demo --once spectrum --no-color \
            | grep -q '50 Hz hum' \
            || { echo "::error::the demo spectrum did not detect its own hum"; exit 1; }

      # The process-tap symbols are resolved with dlsym rather than linked, so
      # the binary starts on macOS older than 14.2 and explains itself instead
      # of dying in the loader. A hard link would make that a launch failure.
      - name: Tap API is not a load-time dependency
        run: |
          if nm -u target/release/soundwatch | grep -q ProcessTap; then
            echo "::error::process-tap symbols are linked; the binary will not start before macOS 14.2"
            exit 1
          fi

  # Linux is a second first-class backend, not a build that happens to compile.
  # It reads ALSA through /proc/asound and meters through libpulse, and both of
  # those are absent or lying on a CI runner, so what is checked here is the
  # part that does not need hardware: that the tree builds and lints clean for
  # the target, that the /proc parsers still agree with the fixtures captured
  # from a real machine, and that the binary runs on a box with no sound at all
  # instead of dying — which is the state most servers are in.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: make build

      - name: Renders without a terminal
        run: |
          for state in main paused filter detail help settings \
                       overview devices streams meters spectrum \
                       latency xruns routing timeline insights; do
            ./target/release/soundwatch --once "$state" --no-color > /dev/null
          done
          ./target/release/soundwatch --demo --once alert --no-color > /dev/null
          ./target/release/soundwatch --demo --once spectrum --no-color \
            | grep -q '50 Hz hum' \
            || { echo "::error::the demo spectrum did not detect its own hum"; exit 1; }

      # The whole point of loading libpulse with dlopen is that a machine
      # without it still runs everything except the meters. A runner is exactly
      # that machine, so the probe must report the meters as unavailable and
      # still exit 0 rather than fail to start.
      - name: Survives a machine with no sound server
        run: |
          if ldd target/release/soundwatch | grep -q libpulse; then
            echo "::error::libpulse is linked; the binary will not start without it"
            exit 1
          fi
          ./target/release/soundwatch --probe-tap

  # The crate claims an MSRV. A claim nothing checks is a guess.
  msrv:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - id: msrv
        run: echo "v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.v }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
