[package]
name = "soundwatch-lite"
version = "0.1.0"
edition = "2024"
# edition 2024 needs a recent toolchain; let-chains need 1.88.
rust-version = "1.88"
description = "SoundWatch Lite — a read-only audio diagnostics TUI. One screen, five keys, four colors."
license = "MIT"
readme = "README.md"
repository = "https://github.com/matthart1983/soundwatch"
homepage = "https://github.com/matthart1983/soundwatch"
keywords = ["audio", "coreaudio", "tui", "diagnostics", "metering"]
categories = ["command-line-utilities", "multimedia::audio"]
# Info.plist and build.rs are load-bearing: without them the binary cannot be
# granted audio-capture consent and every meter reads silence. See src/tcc.rs.
include = ["src/**/*", "build.rs", "Info.plist", "README.md", "LICENSE"]

[[bin]]
name = "soundwatch-lite"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
unicode-width = "0.2.2"

[target.'cfg(target_os = "macos")'.dependencies]
# posix_spawn and dlsym, for the TCC re-exec in src/tcc.rs. Already in the tree
# under crossterm; taking it directly keeps that FFI honestly typed.
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Deliberately *not* `panic = "abort"`.
#
# Two CoreAudio callbacks run on threads this program does not own, and since
# Rust 1.81 a panic crossing an `extern "C"` boundary aborts the process. Both
# are wrapped in `catch_unwind` so a bug there costs a frozen meter rather than
# the whole tool — but `catch_unwind` cannot catch anything when panics abort
# at the site instead of unwinding, so with `panic = "abort"` those guards were
# inert in exactly the build users run.
#
# Unwinding also lets the panic hook restore the terminal before exiting, which
# is the difference between a stack trace and a wrecked shell.
